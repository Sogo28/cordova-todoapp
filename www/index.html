<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="lib/jquery.mobile-1.4.5.min.css">
    <link rel="stylesheet" href="css/index.css">
    <script src="lib/jquery.min.js"></script>
    <script src="lib/jquery.mobile-1.4.5.min.js"></script>
    <script src="js/index.js"></script>
    <title>Document</title>
</head>

<body>
    <div data-role="page">
        <div data-role="header">
            <h1>My App</h1>
        </div>

        <div role="main" class="ui-content">
            <h1>To do app</h1>
            <form>
                <label for="add-task">
                    <input type="text" id="task-field" placeholder="Ajouter une tâche">
                    <input type="button" id="add-task" value="Ajouter">
                    <input type="button" id="reset" value="Réinitialiser">
                </label>
            </form>

            <div data-role="header">
                <h1>En cours</h1>
            </div>
            <ul id="tasks" data-role="listview" data-inset="true"></ul>

        </div>

        <div data-role="footer" data-position="fixed">
            <h1>Aurelius &copy; 2025</h1>
        </div>
    </div>
</body>

</html>
